[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unicode-smuggle"
version = "0.1.0"
description = "Plug-and-play Unicode/ASCII smuggling attack artefact built on PyRIT (COS700)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyrit==1.1.0", "pyyaml>=6", "datasets>=2"]

[tool.setuptools]
packages = ["smuggle"]

[tool.setuptools.package-data]
smuggle = ["templates/*.yaml"]
